name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Criar estrutura Android
        run: flutter create --platforms=android --project-name controle_reunioes --org br.com.controle --no-pub .
      - name: Instalar dependências
        run: flutter pub get
      - name: Gerar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: controle-reunioes-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
