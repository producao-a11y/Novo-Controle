/** Identifica frações cujo tempo previsto é fixo e não pode ser editado. */
function fixedTime(i){if(isSong(i)){let song=SONG_BY_NUMBER.get(Number(i.songNumber));return song&&song.seconds!==null?song.seconds:null}let n=i.name.toLowerCase();if(n.includes('transição'))return n.includes(' b')?60:30;if(n==='boas-vindas')return 40;if(n==='oração inicial'||n==='oração final')return 60;if(n==='comentários iniciais')return 60;if(n==='comentários finais')return 180;if(i.section==='Tesouros da Palavra de Deus'&&n==='discurso')return 600;if(n==='joias espirituais'||n==='jóias espirituais')return 600;if(n==='leitura da bíblia')return 240;if(n.includes('estudo bíblico'))return 1800;return null}
/** Identifica frações com título fixo e não editável. */
function fixedTitle(i){let n=i.name.toLowerCase();return n.includes('transição')||n.includes('cântico')||n==='boas-vindas'||n==='comentários iniciais'||n==='comentários finais'||n==='oração inicial'||n==='oração final'||n==='joias espirituais'||n==='jóias espirituais'||n.includes('estudo bíblico')}
/** Determina se a fração requer cadastro de participante. */
function needsParticipant(i){let n=i.name.toLowerCase();return n==='oração inicial'||n==='joias espirituais'||n==='jóias espirituais'||isStudy(i)||(!fixedTitle(i))}
/** Identifica a fração do Estudo Bíblico para aplicar seus campos específicos. */

/** Identifica o discurso da seção Nossa Vida Cristã. */
function isVidaDiscourse(i){return i.section==='Nossa Vida Cristã'&&!isStudy(i)&&!i.name.toLowerCase().includes('cântico')}
/** Converte uma duração digitada no formato de tempo para segundos. */
function parseTime(value){if(!/^\d{2,3}:\d{2}$/.test(value))return null;let [m,s]=value.split(':').map(Number);return s<60?m*60+s:null}

function createProgram(){let weekStart=mondayFromWeek(document.getElementById('pweek').value),president=document.getElementById('ppresident').value.trim();if(!weekStart)return toast('Selecione uma semana válida.');let date=scheduledDate(weekStart);if(db.programs.some(p=>(p.weekStart||mondayOf(p.date))===weekStart&&!p.discarded))return toast('Já existe programação para esta semana.');let items=sample();items.forEach(i=>{let fixed=fixedTime(i);if(isSong(i)&&!i.songNumber){i.planned=0}else if(fixed!==null){i.planned=fixed;i.fixedPlanned=fixed}i.participant='';if(isStudy(i))i.reader=''});let p={id:uid(),date,weekStart,president,name:'Reuniões semanais',status:'draft',items,created:now()};db.programs.push(p);save();closeModal();showProgram(p.id,true)}
/** Exibe os detalhes de uma programação em modo de consulta. */

" style="width:auto" ${i.hasVideo?'checked':''}> Com vídeo</label><label style="font-weight:400"><input type="checkbox" id="audience${n}" style="width:auto" ${i.hasAudience?'checked':''}> Participação da assistência</label></div>`:`<div class="muted">${esc(i.discourseType||i.name)} · ${i.hasVideo?'Com vídeo':'Sem vídeo'} · ${i.hasAudience?'Com participação da assistência':'Sem participação da assistência'}</div>`}</div>`:''}${isSong(i)?`<div style="margin-top:9px">${structureEditable?`<label for="song${n}">Número do cântico (1–164)</label><input type="number" min="1" max="164" step="1" inputmode="numeric" id="song${n}" value="${i.songNumber||''}" oninput="updateSongPreview(${n})" placeholder="Número do cântico"><div id="songpreview${n}" class="participant" style="font-size:14px">${esc(SONG_BY_NUMBER.get(Number(i.songNumber))?.title||'Informe um número de 1 a 164.')}${SONG_BY_NUMBER.has(Number(i.songNumber))?' · '+(SONG_BY_NUMBER.get(Number(i.songNumber)).seconds===null?'Duração pendente':short(SONG_BY_NUMBER.get(Number(i.songNumber)).seconds)):''}</div>`:`<div class="participant">${esc(SONG_BY_NUMBER.get(Number(i.songNumber))?.title||'Cântico não selecionado')}</div>`}</div>`:''}${needsParticipant(i)?`<div class="participant-fields" style="margin-top:9px">${isStudy(i)?`<div class="muted">Dirigente</div>${editable?`<input id="part${n}" value="${esc(i.participant||'')}" placeholder="Nome do dirigente">`:`<div class="participant">${esc(i.participant||'Não informado')}</div>`}<div class="muted" style="margin-top:8px">Leitor</div>${editable?`<input id="reader${n}" value="${esc(i.reader||'')}" placeholder="Nome do leitor">`:`<div class="participant">${esc(i.reader||'Não informado')}</div>`}`:`${editable?`<input id="part${n}" value="${esc(i.participant||'')}" placeholder="Nome do participante" aria-label="Participante de ${esc(title)}">`:`<div class="participant">${esc(i.participant||'Não informado')}</div>`}${i.section==='Faça Seu Melhor no Ministério'?`<div class="muted" style="margin-top:7px">Ajudante (quando houver)</div>${editable?`<input id="assistant${n}" value="${esc(i.assistant||'')}" placeholder="Nome do segundo participante">`:`<div class="participant">${esc(i.assistant||'Não informado')}</div>`}`:''}`}</div>`:''}<div class="row" style="margin-top:8px"><span class="muted">Tempo previsto${fixed!==null?' · fixo':''}</span>${structureEditable&&fixed===null&&!isSong(i)?`<input class="timeinput" aria-label="Tempo previsto em minutos e segundos" inputmode="numeric" maxlength="6" placeholder="00:00" oninput="timeMask(this)" id="dur${n}" value="${short(i.planned)}">`:`<span class="right">${isSong(i)&&!fixed?"—":short(fixed??i.planned)}</span>`}</div></div>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Fechar</button>${editable?`<button class="btn" onclick="saveProgramEdits('${id}')">Salvar alterações</button>`:''}</div>`);if(editable)p.items.forEach((i,n)=>{if(isVidaDiscourse(i))updateDiscourseFields(n)})}
/** Atualiza os campos do discurso conforme tipo, vídeo e participação selecionados. */
function updateDiscourseFields(n){let type=document.getElementById('discourse'+n),video=document.getElementById('video'+n),audience=document.getElementById('audience'+n);if(!type||!video||!audience)return;if(type.value==='Boletim do Corpo Governante'){video.checked=true;audience.checked=false;video.disabled=true;audience.disabled=true}else{video.disabled=false;audience.disabled=false}}
/** Salva as alterações permitidas em uma programação existente. */
function saveProgramEdits(id){let p=db.programs.find(p=>p.id===id);if(!p||p.discarded||db.active?.programId===id||db.meetings.some(m=>m.programId===id))return;let draft=p.status==='draft',changes=[];for(let n=0;n<p.items.length;n++){let i=p.items[n],fixed=fixedTime(i),chosenSong=null;if(draft&&isSong(i)){let raw=document.getElementById('song'+n)?.value.trim()||'';if(raw&&!/^\d+$/.test(raw))return toast('Número de cântico inválido.');chosenSong=raw?SONG_BY_NUMBER.get(Number(raw)):null;if(raw&&!chosenSong)return toast('Informe um cântico entre 1 e 164.');}let field=document.getElementById('dur'+n);let value=draft&&isSong(i)?(chosenSong?(chosenSong.seconds??0):i.planned):draft&&fixed===null?parseTime(field?.value||''):i.planned;if(value===null){toast('Informe um tempo válido no formato MM:SS.');field?.focus();return}let change={planned:value,participant:needsParticipant(i)?document.getElementById('part'+n)?.value.trim()||'':''};if(draft&&isSong(i)){change.songNumber=chosenSong?.number||null;change.songTitle=chosenSong?.title||'';}if(draft){change.name=fixedTitle(i)||isVidaDiscourse(i)?i.name:(document.getElementById('name'+n)?.value.trim()||i.name);if(isVidaDiscourse(i)){change.discourseType=document.getElementById('discourse'+n).value;change.name=change.discourseType;change.hasVideo=document.getElementById('video'+n).checked;change.hasAudience=document.getElementById('audience'+n).checked}}if(isStudy(i))change.reader=document.getElementById('reader'+n)?.value.trim()||'';if(i.section==='Faça Seu Melhor no Ministério')change.assistant=document.getElementById('assistant'+n)?.value.trim()||'';changes.push(change)}p.president=document.getElementById('editPresident').value.trim();p.items.forEach((i,n)=>Object.assign(i,changes[n]));save();closeModal();render();toast('Programação atualizada.')}

/** Confirma a programação revisada e bloqueia os campos estruturais. */
function confirmProgram(id){let p=db.programs.find(p=>p.id===id);if(!p||p.discarded||p.status!=='draft')return;if(!p.items.length||p.items.some(i=>!i.name||!Number.isFinite(i.planned)))return toast('Programação inválida.');ask('Confirmar esta programação? As frações e os tempos ficarão bloqueados.',()=>{p.status='confirmed';p.confirmedAt=now();save();render();toast('Programação confirmada.')})}/** Descarta uma programação ainda não iniciada, preservando o registro de descarte. */

/** Finaliza a fração atual e avança para a próxima fração da reunião. */
function advance(){let a=db.active;if(!a)return;let t=now();if(t-a.lastAction<250)return;a.lastAction=t;let p=db.programs.find(p=>p.id===a.programId);if(a.unexpected){let ev=a.interruptions[a.interruptions.length-1];ev.end=t;a.unexpected=false;a.since=t;save();render();return}a.records.push({itemId:p.items[a.index].id,index:a.index,start:a.since,end:t});if(a.index===p.items.length-1){finish(t,false);return}a.index++;a.since=t;save();render()}/** Registra o início ou a continuidade de um imprevisto durante a reunião. */
function unexpected(){let a=db.active;if(!a||a.unexpected)return;let t=now();a.records.push({itemId:db.programs.find(p=>p.id===a.programId).items[a.index].id,index:a.index,start:a.since,end:t});a.interruptions.push({id:uid(),index:a.index,start:t,end:null,category:'Outro',notes:''});a.unexpected=true;a.since=t;save();render()}/** Solicita confirmação e encerra antecipadamente a reunião em andamento. */
function earlyEnd(){if(!db.active)return;ask('Encerrar a reunião antecipadamente? As frações restantes ficarão com tempo zero.',()=>finish(now(),true))}/** Finaliza a reunião, calcula os tempos realizados e salva o relatório. */

/** Calcula o CRC-32 usado para verificar a integridade do PDF importado. */
function crc32(buffer){let c=-1,bytes=new Uint8Array(buffer);for(let b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return(c^(-1))>>>0}
/** Abre o seletor de arquivo PDF para iniciar a importação de programação. */
function importPdfClick(){if(db.active)return toast('Finalize a reunião antes de importar.');document.getElementById('pdffile').click()}
/** Constrói uma programação provisória a partir dos dados extraídos do PDF. */
function buildPdfProgram(w){
 let items=sample(),out=[],byNum=Object.fromEntries(w.activities.map(a=>[a.num,a]));
 const /** Cria um objeto de fração com identificador e propriedades informadas. */
clone=(section,name,planned,extra={})=>({id:uid(),section,name,planned,...extra});
 const /** Cria uma fração de cântico vinculada ao número e à base local de cânticos. */
song=(section,name,num)=>{let info=SONG_BY_NUMBER.get(num);return clone(section,name,info?.seconds??0,{songNumber:num,songTitle:info?.title||''})};
 out.push(clone('Abertura','Boas-vindas',40));out.push(song('Abertura','Cântico inicial',w.songs[0]));out.push(clone('Abertura','Oração inicial',60,{participant:w.prayer}));out.push(clone('Abertura','Comentários iniciais',60));
 const treasure='Tesouros da Palavra de Deus',ministry='Faça Seu Melhor no Ministério',life='Nossa Vida Cristã';
 out.push(clone(treasure,'Discurso',600,{participant:byNum[1].participants[0]||'',theme:byNum[1].name}));
 out.push(clone(treasure,'Transição A',30));out.push(clone(treasure,'Joias espirituais',600,{participant:byNum[2].participants[0]||''}));
 out.push(clone(treasure,'Transição A',30));out.push(clone(treasure,'Leitura da Bíblia',240,{participant:byNum[3].participants[0]||'',theme:byNum[3].name}));out.push(clone(treasure,'Transição B',60));
 for(let n=4;n<=6;n++){let a=byNum[n];out.push(clone(ministry,a.name,(a.mins||0)*60,{participant:a.participants[0]||'',assistant:a.participants[1]||''}));out.push(clone(ministry,'Transição B',60))}
 out.push(song(life,'Cântico do meio',w.songs[1]));let a=byNum[7],type=/necessidades locais/i.test(a.name)?'Necessidades Locais':'Consideração';
 out.push(clone(life,type,900,{participant:a.participants[0]||'',theme:a.name,discourseType:type,hasVideo:!!a.hasVideo,hasAudience:false}));
 a=byNum[8];out.push(clone(life,'Estudo bíblico de congregação',1800,{participant:a.participants[0]||'',reader:a.participants[1]||''}));
 out.push(clone('Encerramento','Comentários finais',180));out.push(song('Encerramento','Cântico final',w.songs[2]));out.push(clone('Encerramento','Oração final',60));
 return {id:uid(),date:scheduledDate(w.weekStart),weekStart:w.weekStart,president:w.president,name:'Reuniões semanais',status:'draft',items:out,created:now(),importedFrom:'Designações NVMC — novembro/dezembro 2026',importWarnings:w.weekStart==='2026-11-02'?['Reunião excepcional em 04/11/2026; participantes indicados como Assembleia.']:[]};
}
/** Apresenta as semanas detectadas e permite escolher quais importar. */
function previewPdfImport(){let existing=new Set(db.programs.filter(p=>!p.discarded).map(p=>p.weekStart||mondayOf(p.date)));
 modal(`<h2>Importar programações do PDF</h2><p class="muted">Documento reconhecido: Designações NVMC — novembro e dezembro de 2026. Foram identificadas 9 semanas. Confira as informações antes de confirmar cada programação.</p><div class="note">A importação cria programações <b>provisórias</b>. Nenhuma reunião existente será sobrescrita. Revise temas, participantes e durações antes de confirmar.</div><div style="max-height:48vh;overflow:auto">${PDF_PROGRAMS_2026.map((w,i)=>{let exists=existing.has(w.weekStart);return `<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #e6edf4;font-weight:400"><input type="checkbox" class="pdfweek" value="${i}" style="width:auto;margin-top:4px" ${exists?'disabled':'checked'}><span><b>${weekTitle(w.weekStart)}</b><br><span class="muted">Presidente: ${esc(w.president)} · Cânticos: ${w.songs.join(', ')}${exists?' · Já cadastrada':''}</span></span></label>`}).join('')}</div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="savePdfImport()">Importar selecionadas</button></div>`);
}
/** Salva as programações semanais selecionadas na importação do PDF. */
function savePdfImport(){let indices=[...document.querySelectorAll('.pdfweek:checked')].map(x=>Number(x.value));if(!indices.length)return toast('Selecione ao menos uma semana ainda não cadastrada.');let old=db.programs.slice(),count=0;try{for(let i of indices){let w=PDF_PROGRAMS_2026[i];if(db.programs.some(p=>!p.discarded&&(p.weekStart||mondayOf(p.date))===w.weekStart))continue;db.programs.push(buildPdfProgram(w));count++}if(!save()){db.programs=old;return}closeModal();setTab('programs');toast(count+' programações provisórias importadas. Revise antes de confirmar.')}catch(e){db.programs=old;alert('Falha na importação. Nenhuma programação foi alterada: '+e.message)}}
document.getElementById('pdffile').addEventListener('change',async function(){let file=this.files[0];this.value='';if(!file)return;if(db.active)return toast('Finalize a reunião antes de importar.');try{let buf=await file.arrayBuffer();let bytes=new Uint8Array(buf);if(bytes.length<4||String.fromCharCode(...bytes.slice(0,4))!=='%PDF')throw Error('O arquivo selecionado não é um PDF.');if(buf.byteLength!==PDF_SIGNATURE_2026.size||crc32(buf)!==PDF_SIGNATURE_2026.crc)throw Error('Esta versão offline reconhece somente o PDF de designações de novembro/dezembro de 2026 enviado para desenvolver o importador. Outros PDFs precisarão de um leitor genérico em uma atualização futura.');previewPdfImport()}catch(e){alert(e.message)}});

</script></body></html>
