<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Reuniões</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita de folha de marcação. O cronômetro é o centro da tela,
   a sequência vem abaixo e os botões de ação ficam fixos ao alcance do polegar. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E7EBEF; --fg:#121B24; --muted:#556270; --line:#D3DAE1;
  --accent:#2347D8; --accent-fg:#FFFFFF;
  --ok:#1B7A4B; --warn:#9A5B00; --bad:#BE3326;
  --ok-bg:#E3F3EA; --warn-bg:#FBEBD0; --bad-bg:#FBE0DC;
  --shadow:0 1px 2px rgba(18,27,36,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#161E27; --surface2:#1F2933; --fg:#E8EDF2; --muted:#98A5B2; --line:#2A3541;
    --accent:#7C98FF; --accent-fg:#0B1220;
    --ok:#4CC38A; --warn:#E3A33B; --bad:#FF7A6B;
    --ok-bg:rgba(76,195,138,.14); --warn-bg:rgba(227,163,59,.15); --bad-bg:rgba(255,122,107,.15);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161E27; --surface2:#1F2933; --fg:#E8EDF2; --muted:#98A5B2; --line:#2A3541;
  --accent:#7C98FF; --accent-fg:#0B1220;
  --ok:#4CC38A; --warn:#E3A33B; --bad:#FF7A6B;
  --ok-bg:rgba(76,195,138,.14); --warn-bg:rgba(227,163,59,.15); --bad-bg:rgba(255,122,107,.15);
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:16px; line-height:1.45;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body.has-dock .wrap{padding-bottom:196px}
.wrap{max-width:560px; margin:0 auto; padding-top:18px; padding-bottom:40px; display:flex; flex-direction:column; gap:18px}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:28px; line-height:1.1; font-weight:700}
h2{font-size:20px; line-height:1.2; font-weight:600}
.sub{margin:6px 0 0; color:var(--muted); font-size:14px}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.mono{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.top{display:flex; flex-direction:column; gap:6px; min-width:0}
.toprow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-width:0}
.link{background:none; border:0; padding:6px 0; color:var(--accent); font-weight:600; cursor:pointer; text-align:left}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); min-width:0}
.panel label{font-size:13px; font-weight:600; color:var(--muted)}
.panel input[type=text]{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:12px; min-height:46px}
.meta{margin:0; font-size:13px; color:var(--muted)}
.notice{background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px 12px; font-size:14px}

.btn{min-height:48px; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-align:center; line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
.btn.danger{color:var(--bad); border-color:var(--bad); background:transparent}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.big{min-height:64px; font-size:17px; flex-direction:column; gap:2px; width:100%}
.btn.big .b-k{font-size:12px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:600}
.btn.big .b-v{font-family:var(--f-display); font-size:19px; font-weight:700; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--surface2); color:var(--muted); white-space:nowrap}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.acc{background:var(--accent); color:var(--accent-fg)}

.runhead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.total{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:30px; font-weight:600; line-height:1.1}
.parts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.pc{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; min-width:0}
.pl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:500; font-size:16px}

.cur{background:var(--surface); border:2px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0}
.cur[data-state="ok"]{border-color:var(--ok)}
.cur[data-state="warn"]{border-color:var(--warn)}
.cur[data-state="bad"]{border-color:var(--bad)}
.cur[data-state="none"]{border-color:var(--line)}
.cur[data-state="x"]{border-color:var(--accent)}
.curname{font-size:24px; line-height:1.15; font-weight:700; overflow-wrap:anywhere}
.clock{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:clamp(48px,17vw,76px); line-height:1.05; letter-spacing:-.02em}
.cur[data-state="warn"] .clock{color:var(--warn)}
.cur[data-state="bad"] .clock{color:var(--bad)}
.bar{height:8px; border-radius:99px; background:var(--surface2); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--ok); border-radius:99px}
.cur[data-state="warn"] .bar i{background:var(--warn)}
.cur[data-state="bad"] .bar i{background:var(--bad)}
.curmeta{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:13px; color:var(--muted)}
.curmeta b{color:var(--fg); font-family:var(--f-mono); font-weight:500}
.devtxt{font-family:var(--f-mono); font-weight:600}

.seq{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seq .ph{padding:8px 12px; background:var(--surface2); font-size:12px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.seq li.row{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:baseline; padding:10px 12px; border-top:1px solid var(--line)}
.seq li.row:first-child,.seq li.ph+li.row{border-top:0}
.seq .nm{overflow-wrap:anywhere}
.seq .tm{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); text-align:right}
.seq .rl{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:14px; text-align:right; min-width:5.2ch}
.seq li.is-cur{background:var(--surface2); font-weight:600}
.seq li.is-todo .nm{color:var(--muted)}
.seq li.is-skip .nm{color:var(--muted); text-decoration:line-through}
.dv-ok{color:var(--muted)} .dv-warn{color:var(--warn)} .dv-bad{color:var(--bad)}

.dock{position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line); z-index:5;
  padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.dock-in{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:8px}
.dock-row{display:flex; gap:8px}
.dock-row .btn{flex:1 1 0; min-width:0; min-height:44px; font-size:14px; padding:8px 6px}

.kpis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.kpi .v{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; display:block}
.tbl{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.tbl .tr{display:grid; grid-template-columns:minmax(0,1fr) 62px 62px 66px; gap:8px; padding:9px 12px; border-top:1px solid var(--line); align-items:baseline; font-size:14px}
.tbl .th{background:var(--surface2); border-top:0; font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:600; color:var(--muted)}
.tbl .tr>span:not(:first-child){text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums}
.tbl .th>span:not(:first-child){font-family:var(--f-body)}
.tbl .tr .nm{overflow-wrap:anywhere}
.tbl .tr.dim .nm{color:var(--muted)}
.tbl .tr.sum{font-weight:600; background:var(--surface2)}
.segs{display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:8px 12px; border-top:1px solid var(--line); font-size:14px}
.seg:first-child{border-top:0}
.seg .t0{font-family:var(--f-mono); color:var(--muted); font-size:13px}
.seg .d{font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-weight:500}
.seg .an{overflow-wrap:anywhere}
.seg .btn{min-height:36px; padding:4px 10px; font-size:13px}
.hist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; font-size:14px}
.hist li{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px}
.hist .when{font-family:var(--f-mono); color:var(--muted); font-size:12px}
.empty{color:var(--muted); font-size:14px; margin:0}
.mlist{display:flex; flex-direction:column; gap:8px}
.mitem{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; cursor:pointer; width:100%}
.mitem .mn{font-weight:600; overflow-wrap:anywhere}
.mitem .mm{font-size:13px; color:var(--muted)}
details.tpl{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
details.tpl summary{cursor:pointer; font-weight:600}
details.tpl ol{margin:10px 0 0; padding-left:24px; display:flex; flex-direction:column; gap:4px; font-size:14px}
details.tpl .tt{color:var(--muted); font-family:var(--f-mono); font-size:13px}

#sheet{position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet-bg{position:absolute; inset:0; background:rgba(8,12,18,.55)}
.sheet-card{position:relative; width:100%; max-width:560px; background:var(--surface); border-radius:16px 16px 0 0; border:1px solid var(--line);
  padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:12px; max-height:88%; overflow-y:auto}
.sheet-card p{margin:0; font-size:15px}
.sheet-card select,.sheet-card textarea{width:100%; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:12px; min-height:46px}
.sheet-card textarea{min-height:180px; font-family:var(--f-mono); font-size:13px}
.chips{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px}
.stack{display:flex; flex-direction:column; gap:8px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(150px + env(safe-area-inset-bottom, 0px)); z-index:30; background:var(--fg); color:var(--bg);
  padding:10px 16px; border-radius:999px; font-size:14px; font-weight:500; max-width:calc(100% - 32px); text-align:center}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .3s linear} }
@media (max-width:380px){ .tbl .tr{grid-template-columns:minmax(0,1fr) 54px 54px 58px; gap:6px; padding:9px 10px} .kpi .v{font-size:16px} }
</style>


</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
//CORE-START
var KEY='controle-reunioes.v1';
var PARTS={abertura:'Abertura',tesouros:'Tesouros da Palavra de Deus',ministerio:'Faça Seu Melhor no Ministério',nvc:'Nossa Vida Cristã',encerramento:'Encerramento',extra:'Imprevistos'};
var PART_SHORT={abertura:'Abertura',tesouros:'Tesouros',ministerio:'Ministério',nvc:'Vida Cristã',encerramento:'Encerram.',extra:'Imprevistos'};
var PART_ORDER=['abertura','tesouros','ministerio','nvc','encerramento','extra'];
var EXTRA_LABELS=['Atraso ou ajuste na programação','Atividade não prevista'];
function A(name,part,target,max,opt){return {name:name,part:part,target:target,max:max||null,optional:!!opt};}
var TPL=[
  A('Boas-vindas e informe do cântico','abertura',40,40),
  A('Cântico inicial (125)','abertura',170,300),
  A('Oração inicial','abertura',90,180),
  A('Comentários iniciais','abertura',60),
  A('Jeová é um juiz justo e misericordioso','tesouros',600),
  A('Transição A','tesouros',30,30),
  A('Joias espirituais','tesouros',600),
  A('Transição A','tesouros',30,30),
  A('Leitura da Bíblia (Jeremias 48:1-13)','tesouros',240),
  A('Transição B','tesouros',60,90),
  A('Iniciando conversas: De casa em casa','ministerio',180),
  A('Transição B','ministerio',60,90),
  A('Cultivando o interesse: Testemunho informal','ministerio',240),
  A('Transição B','ministerio',60,90),
  A('Fazendo discípulos: Dirigindo estudo bíblico','ministerio',300),
  A('Transição B','ministerio',60,90),
  A('Cântico da seção Nossa Vida Cristã (158)','nvc',251,300),
  A('Transição A','nvc',30,30),
  A('Necessidades locais','nvc',900),
  A('Transição A','nvc',30,30),
  A('Estudo Bíblico de Congregação','nvc',1800),
  A('Comentários finais','encerramento',180),
  A('Anúncios (se houver)','encerramento',null,null,true),
  A('Cântico final (54)','encerramento',155,300),
  A('Oração final','encerramento',90,180)
];
function pad(n){return n<10?'0'+n:''+n;}
function fmtMS(ms){var s=Math.max(0,Math.round(ms/1000));var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h>0?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x);}
function fmtH(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/3600)+':'+pad(Math.floor((s%3600)/60))+':'+pad(s%60);}
function fmtDev(ms){var s=Math.round(Math.abs(ms)/1000);if(s===0)return '0:00';return (ms>0?'+':'−')+Math.floor(s/60)+':'+pad(s%60);}
function clone(o){return JSON.parse(JSON.stringify(o));}
function actName(m,k){return typeof k==='number'?m.acts[k].name:String(k).slice(2);}
function partOf(m,k){return typeof k==='number'?m.acts[k].part:'extra';}
function limitState(act,ms){
  var s=ms/1000;
  if(!act||act.target==null)return 'none';
  if(act.max){if(s>act.max)return 'bad';if(s>act.target)return 'warn';return 'ok';}
  return s>act.target?'bad':'ok';
}
function newMeeting(name,now){
  return {id:'m'+now,name:name,createdAt:now,tpl:'Nossa Vida e Ministério Cristão · 26 de outubro a 1º de novembro',acts:clone(TPL),
    events:[{k:'start',t:now}],shifts:[],fixes:[],status:'running',endedAt:null};
}
function derive(m,now){
  var ev=m.events,shiftMap={};
  (m.shifts||[]).forEach(function(s){shiftMap[s.ev]=(shiftMap[s.ev]||0)+s.by;});
  var times=[],prev=0;
  ev.forEach(function(e,i){var t=e.t-(shiftMap[i]||0);if(t<prev)t=prev;times.push(t);prev=t;});
  var segs=[],cur=null,pausedAct=null,lastPlanned=0,paused=false,ended=false;
  function close(t){if(cur){segs.push({act:cur.act,start:cur.start,end:Math.max(t,cur.start)});cur=null;}}
  ev.forEach(function(e,i){
    var t=times[i];
    if(e.k==='start'){cur={act:0,start:t};}
    else if(e.k==='sw'){if(paused){paused=false;}else{close(t);}cur={act:e.to,start:t};}
    else if(e.k==='extra'){if(cur&&typeof cur.act==='number')lastPlanned=cur.act;close(t);cur={act:'x:'+e.label,start:t};}
    else if(e.k==='back'){close(t);cur={act:lastPlanned,start:t};}
    else if(e.k==='pause'){if(cur){pausedAct=cur.act;}close(t);paused=true;}
    else if(e.k==='resume'){cur={act:pausedAct,start:t};paused=false;}
    else if(e.k==='end'){close(t);ended=true;paused=false;}
  });
  var open=null;
  if(cur){open={act:cur.act,start:cur.start,end:Math.max(now,cur.start)};if(typeof cur.act==='number')lastPlanned=cur.act;}
  else if(paused&&typeof pausedAct==='number'){lastPlanned=pausedAct;}
  var fx={};(m.fixes||[]).forEach(function(f){fx[f.seg]=f.to;});
  segs.forEach(function(s,i){s.orig=s.act;if(fx[i]!==undefined)s.act=fx[i];s.i=i;});
  return {segs:segs,open:open,paused:paused,ended:ended,curAct:open?open.act:(paused?pausedAct:null),lastPlanned:lastPlanned,times:times};
}
function agg(m,d){
  var byAct={},byPart={},total=0;
  function add(k,ms){if(ms<0)ms=0;var o=byAct[k]||(byAct[k]={ms:0,n:0});o.ms+=ms;if(ms>0)o.n++;var p=partOf(m,k);byPart[p]=(byPart[p]||0)+ms;total+=ms;}
  d.segs.forEach(function(s){add(s.act,s.end-s.start);});
  if(d.open)add(d.open.act,d.open.end-d.open.start);
  return {byAct:byAct,byPart:byPart,total:total};
}
function planned(m,a,part){
  var p=0;
  m.acts.forEach(function(x,i){if((part==null||x.part===part)&&x.target!=null&&a.byAct[i]&&a.byAct[i].ms>0)p+=x.target*1000;});
  return p;
}
function clockStr(t){var d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function dateStr(t){var d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function meetingBounds(m,d){
  var start=d.times[0]!==undefined?d.times[0]:m.createdAt;
  var end=null;
  m.events.forEach(function(e,i){if(e.k==='end')end=d.times[i];});
  return {start:start,end:end};
}
function correctionsList(m,d){
  var out=[];
  (m.fixes||[]).forEach(function(f){
    var s=d.segs[f.seg];
    out.push({at:f.at,text:(s?'Intervalo das '+clockStr(s.start)+' ('+fmtMS(s.end-s.start)+')':'Intervalo')+': '+actName(m,f.from)+' → '+actName(m,f.to)});
  });
  (m.shifts||[]).forEach(function(s){
    out.push({at:s.at,text:'Último toque ajustado em '+Math.round(s.by/1000)+' s para trás ('+(s.label||'')+')'});
  });
  out.sort(function(x,y){return x.at-y.at;});
  return out;
}
function summaryText(m,now){
  var d=derive(m,now),a=agg(m,d),b=meetingBounds(m,d),L=[];
  L.push('Controle de Reuniões — '+m.name);
  L.push('Data: '+dateStr(b.start)+' · início '+clockStr(b.start)+(b.end?' · fim '+clockStr(b.end):''));
  L.push('Tempo cronometrado: '+fmtH(a.total)+' · previsto das frações realizadas: '+fmtH(planned(m,a,null))+' · desvio: '+fmtDev(a.total-planned(m,a,null)));
  L.push('');L.push('POR PARTE');
  PART_ORDER.forEach(function(p){
    var real=a.byPart[p]||0;if(p==='extra'&&real===0)return;
    L.push(PARTS[p]+': '+fmtMS(real)+(p==='extra'?'':' (previsto '+fmtMS(planned(m,a,p))+', desvio '+fmtDev(real-planned(m,a,p))+')'));
  });
  L.push('');L.push('POR FRAÇÃO');
  var skipped=[];
  m.acts.forEach(function(x,i){
    var o=a.byAct[i];
    if(!o||o.ms===0){skipped.push(x.name);return;}
    L.push((i+1)+'. '+x.name+': '+fmtMS(o.ms)+(x.target!=null?' (previsto '+fmtMS(x.target*1000)+', desvio '+fmtDev(o.ms-x.target*1000)+')':''));
  });
  Object.keys(a.byAct).forEach(function(k){if(k.indexOf('x:')===0)L.push(k.slice(2)+': '+fmtMS(a.byAct[k].ms));});
  if(skipped.length){L.push('');L.push('NÃO REALIZADAS: '+skipped.join('; '));}
  var cl=correctionsList(m,d);
  if(cl.length){L.push('');L.push('CORREÇÕES');cl.forEach(function(c){L.push(clockStr(c.at)+' — '+c.text);});}
  return L.join('\n');
}
function csvText(m,now){
  var d=derive(m,now),b=meetingBounds(m,d);
  function q(v){return '"'+String(v).replace(/"/g,'""')+'"';}
  var rows=[['reuniao','data','inicio','fim','duracao_s','fracao','parte','fracao_original','corrigido'].join(';')];
  d.segs.forEach(function(s){
    if(s.end-s.start<500)return;
    rows.push([q(m.name),dateStr(b.start),clockStr(s.start),clockStr(s.end),Math.round((s.end-s.start)/1000),q(actName(m,s.act)),q(PARTS[partOf(m,s.act)]),q(actName(m,s.orig)),s.act!==s.orig?'sim':'não'].join(';'));
  });
  return '﻿'+rows.join('\r\n');
}

/* ---------- armazenamento ---------- */
var store={meetings:[]},storageOk=true;
function load(){
  try{localStorage.setItem(KEY+'.t','1');localStorage.removeItem(KEY+'.t');}catch(e){storageOk=false;}
  try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.meetings)store=o;}}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storageOk=false;}}
function byId(id){for(var i=0;i<store.meetings.length;i++)if(store.meetings[i].id===id)return store.meetings[i];return null;}
function activeMeeting(){for(var i=store.meetings.length-1;i>=0;i--)if(store.meetings[i].status!=='saved')return store.meetings[i];return null;}

/* ---------- interface ---------- */
var app=document.getElementById('app'),sheet=document.getElementById('sheet'),toastEl=document.getElementById('toast');
var view={name:'home',id:null},dl=null,toastTimer=null,alerted='';
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cur(){return view.id?byId(view.id):null;}
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.hidden=true;},2400);}
function openSheet(html){sheet.innerHTML='<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card" role="dialog" aria-modal="true">'+html+'</div>';sheet.hidden=false;}
function closeSheet(){sheet.hidden=true;sheet.innerHTML='';}
function setText(id,t){var el=document.getElementById(id);if(el&&el.textContent!==t)el.textContent=t;}
var wl=null;
function wake(){if(window.NativeApp)NativeApp.postMessage(JSON.stringify({action:'wake'}));try{if(navigator.wakeLock&&!wl){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null;});}).catch(function(){});}}catch(e){}}
function dvClass(act,ms){var s=limitState(act,ms);return s==='bad'?'dv-bad':s==='warn'?'dv-warn':'dv-ok';}
function statusPill(m){
  if(m.status==='saved')return '<span class="pill ok">Salva</span>';

}

  else{h+='<div class="mlist">';done.forEach(function(x){var d=derive(x,Date.now()),a=agg(x,d);h+='<button class="mitem" data-act="open" data-arg="'+x.id+'"><span><span class="mn">'+esc(x.name)+'</span><br><span class="mm">'+dateStr(x.createdAt)+' · '+fmtH(a.total)+'</span></span>'+statusPill(x)+'</button>';});h+='</div>';}

function leftTxt(t){return t>6300000?'Passou '+fmtH(t-6300000)+' do limite de 1:45:00':'Restam '+fmtH(6300000-t)+' até o limite de 1:45:00';}
function runHtml(m){

  h+='<div class="runhead"><div><div class="eyebrow">Tempo cronometrado</div><div class="total" id="tTotal">'+fmtH(a.total)+'</div><div class="meta" id="tLeft">'+leftTxt(a.total)+'</div></div><div class="meta" style="text-align:right">'+esc(m.name)+'</div></div>';
  h+='<div class="parts">';

  }else if(isX){h+='<div class="curmeta"><span>Este tempo conta no total, fora das três partes.</span></div>';}

  h+='</section>';
  h+='<ol class="seq" aria-label="Sequência da reunião">';

    var r=a.byAct[i],ms=r?r.ms:0,cls,right;
    if(i===act&&!isX){cls='is-cur';right='<span class="rl '+dvClass(x,ms)+'" id="rt-'+i+'">'+fmtMS(ms)+'</span>';}
    else if(ms>0){cls='is-done';right='<span class="rl '+dvClass(x,ms)+'">'+fmtMS(ms)+'</span>';}

    else{cls='is-todo';right='<span class="rl dv-ok">—</span>';}
    if(i===ci&&isX&&ms===0){cls='is-cur';}
    h+='<li class="row '+cls+'"><span class="nm">'+(i+1)+'. '+esc(x.name)+'</span><span class="tm">'+(x.target!=null?fmtMS(x.target*1000):'—')+'</span>'+right+'</li>';
  });
  Object.keys(a.byAct).forEach(function(k){if(k.indexOf('x:')===0)h+='<li class="row is-done"><span class="nm">'+esc(k.slice(2))+'</span><span class="tm">—</span><span class="rl">'+fmtMS(a.byAct[k].ms)+'</span></li>';});
  h+='</ol>';
  /* dock */

  if(d.paused){h+='<button class="btn primary big" data-act="resume"><span class="b-k">Pausada</span><span class="b-v">Retomar</span></button>';}
  else if(isX){h+='<button class="btn primary big" data-act="back"><span class="b-k">Voltar para</span><span class="b-v">'+esc(m.acts[d.lastPlanned].name)+'</span></button>';}
  else if(act>=n-1){h+='<button class="btn primary big" data-act="askEnd"><span class="b-k">Última fração</span><span class="b-v">Encerrar reunião</span></button>';}

  });

  h+='<section class="stack"><h2>Por fração</h2><div class="tbl"><div class="tr th"><span>Fração</span><span>Prev.</span><span>Real</span><span>Desvio</span></div>';

    h+='<div class="tr"><span class="nm">'+(i+1)+'. '+esc(x.name)+'</span><span>'+(x.target!=null?fmtMS(x.target*1000):'—')+'</span><span>'+fmtMS(ms)+'</span><span class="'+dvClass(x,ms)+'">'+(x.target!=null?fmtDev(ms-x.target*1000):'')+'</span></div>';
  });
  Object.keys(a.byAct).forEach(function(k){if(k.indexOf('x:')===0)h+='<div class="tr"><span class="nm">'+esc(k.slice(2))+'</span><span>—</span><span>'+fmtMS(a.byAct[k].ms)+'</span><span></span></div>';});
  h+='</div></section>';

  else{
    h+='<div class="segs">';

      h+='<div class="seg"><span class="t0">'+clockStr(s.start)+'</span><span class="d">'+fmtMS(s.end-s.start)+'</span><span class="an">'+esc(actName(m,s.act))+(s.act!==s.orig?' <span class="pill warn">corrigido</span>':'')+'</span>'+(ro?'':'<button class="btn" data-act="rcMenu" data-arg="'+s.i+'">Alterar</button>')+'</div>';

  h+='<button class="btn danger" data-act="askDel">Apagar esta reunião</button>';
  h+='<div class="dock"><div class="dock-in">';

function render(){
  var m=cur(),h;
  document.body.classList.toggle('has-dock',(view.name==='run'||view.name==='review')&&!!m);
  if(view.name==='run'&&m)h=runHtml(m);
  else if(view.name==='review'&&m)h=reviewHtml(m);
  else{view.name='home';view.id=null;h=homeHtml();}
  app.innerHTML=h;
}

function tick(){
  if(view.name!=='run')return;
  var m=cur();if(!m||m.status!=='running')return;
  var now=Date.now(),d=derive(m,now);
  if(!d.open)return;
  var a=agg(m,d),act=d.curAct,isX=typeof act==='string',o=a.byAct[act]||{ms:0},ca=isX?null:m.acts[act];
  setText('tTotal',fmtH(a.total));
  setText('tLeft',leftTxt(a.total));
  PART_ORDER.forEach(function(p){setText('pc-'+p,fmtMS(a.byPart[p]||0));});
  setText('tCur',fmtMS(o.ms));
  if(!isX)setText('rt-'+act,fmtMS(o.ms));
  var card=document.getElementById('curcard');
  var st=isX?'x':limitState(ca,o.ms);
  if(card&&card.getAttribute('data-state')!==st)card.setAttribute('data-state',st);
  var bar=document.getElementById('bar');
  if(bar&&ca&&ca.target!=null)bar.style.width=Math.min(100,o.ms/(ca.target*1000)*100)+'%';
  if(ca&&ca.target!=null)setText('devtxt',o.ms>ca.target*1000?fmtDev(o.ms-ca.target*1000):'');
  if(st==='bad'&&alerted!==m.id+':'+act){alerted=m.id+':'+act;try{if(navigator.vibrate)navigator.vibrate([220,120,220]);}catch(e){}}
}

function push(m,e){m.events.push(e);save();render();}
function lastTouch(m,d){
  for(var i=m.events.length-1;i>0;i--){var k=m.events[i].k;if(k==='sw'||k==='extra'||k==='back')return i;}
  return -1;
}
function summarySheet(text){
  openSheet('<h3>Copie o resumo</h3><p>O navegador não deixou copiar automaticamente. Selecione o texto abaixo e copie.</p><textarea id="sumTxt" readonly>'+esc(text)+'</textarea><button class="btn primary" data-act="closeSheet">Fechar</button>');
  var ta=document.getElementById('sumTxt');if(ta){ta.focus();ta.select();}
}

function onAct(name,arg){
  var m=cur(),now=Date.now(),d;
  switch(name){
    case 'closeSheet':closeSheet();break;
    case 'home':view={name:'home',id:null};render();window.scrollTo(0,0);break;
    case 'new':{
      var inp=document.getElementById('mname');var nm=(inp&&inp.value.trim())||'Reunião de '+dateStr(now);
      var nmeet=newMeeting(nm,now);store.meetings.push(nmeet);save();view={name:'run',id:nmeet.id};render();wake();window.scrollTo(0,0);break;}
    case 'open':{
      var t=byId(arg);if(!t)break;view={name:t.status==='running'?'run':'review',id:t.id};render();if(t.status==='running')wake();window.scrollTo(0,0);break;}
    case 'next':{
      if(!m)break;d=derive(m,now);if(d.paused||typeof d.curAct!=='number')break;
      if(d.curAct>=m.acts.length-1){onAct('askEnd');break;}
      push(m,{k:'sw',t:now,to:d.curAct+1});break;}
    case 'skip':{
      if(!m)break;d=derive(m,now);if(d.paused||typeof d.curAct!=='number')break;
      push(m,{k:'sw',t:now,to:Math.min(m.acts.length-1,d.curAct+2)});toast('Fração pulada: fica como não realizada');break;}
    case 'pause':if(m)push(m,{k:'pause',t:now});break;
    case 'resume':if(m){push(m,{k:'resume',t:now});wake();}break;
    case 'back':if(m)push(m,{k:'back',t:now});break;
    case 'extraMenu':
      openSheet('<h3>Imprevisto</h3><p>O tempo passa a contar à parte, fora das três partes, até você voltar para a fração em andamento.</p><div class="stack">'+EXTRA_LABELS.map(function(l,i){return '<button class="btn" data-act="extra" data-arg="'+i+'">'+esc(l)+'</button>';}).join('')+'<button class="btn ghost" data-act="closeSheet">Cancelar</button></div>');break;
    case 'extra':if(m){closeSheet();push(m,{k:'extra',t:now,label:EXTRA_LABELS[+arg]});}break;
    case 'adjMenu':{
      if(!m)break;d=derive(m,now);var li=lastTouch(m,d);
      if(li<0){openSheet('<h3>Ajustar último toque</h3><p>Ainda não há troca de fração para ajustar.</p><button class="btn primary" data-act="closeSheet">Fechar</button>');break;}
      var ago=now-d.times[li];
      openSheet('<h3>Ajustar último toque</h3><p>Use quando você trocou de fração com atraso. A troca recua alguns segundos: a fração anterior ganha esse tempo e a atual perde. Última troca há '+fmtMS(ago)+'.</p><div class="chips">'+[5,10,20,30].map(function(s){return '<button class="btn" data-act="adj" data-arg="'+s+'">'+s+' s</button>';}).join('')+'</div><button class="btn ghost" data-act="closeSheet">Cancelar</button>');break;}
    case 'adj':{
      if(!m)break;d=derive(m,now);var idx=lastTouch(m,d);if(idx<0)break;
      var by=(+arg)*1000;
      var lab=d.curAct!==null&&d.curAct!==undefined?actName(m,d.curAct):'';
      m.shifts.push({at:now,ev:idx,by:by,label:'troca para '+lab});save();closeSheet();render();toast('Troca recuada em '+arg+' s');break;}
    case 'askEnd':
      openSheet('<h3>Encerrar a reunião?</h3><p>O cronômetro para e o resumo fica pendente para revisão. Você ainda pode corrigir intervalos antes de salvar.</p><div class="two"><button class="btn" data-act="closeSheet">Continuar</button><button class="btn primary" data-act="end">Encerrar</button></div>');break;
    case 'end':{
      if(!m)break;closeSheet();m.events.push({k:'end',t:now});m.status='review';m.endedAt=now;save();view={name:'review',id:m.id};render();window.scrollTo(0,0);break;}
    case 'rcMenu':{
      if(!m)break;d=derive(m,now);var sg=d.segs[+arg];if(!sg)break;
      var opts='';PART_ORDER.forEach(function(p){
        if(p==='extra'){opts+='<optgroup label="Imprevistos">'+EXTRA_LABELS.map(function(l){var v='x:'+l;return '<option value="'+esc(v)+'"'+(sg.act===v?' selected':'')+'>'+esc(l)+'</option>';}).join('')+'</optgroup>';return;}
        opts+='<optgroup label="'+esc(PARTS[p])+'">';
        m.acts.forEach(function(x,i){if(x.part===p)opts+='<option value="'+i+'"'+(sg.act===i?' selected':'')+'>'+(i+1)+'. '+esc(x.name)+'</option>';});
        opts+='</optgroup>';
      });
      openSheet('<h3>Alterar classificação</h3><p>Intervalo das '+clockStr(sg.start)+', duração '+fmtMS(sg.end-sg.start)+'. Hoje está em <b>'+esc(actName(m,sg.act))+'</b>.</p><label for="rcSel" class="eyebrow">Mover para</label><select id="rcSel">'+opts+'</select><div class="two"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn primary" data-act="rcAsk" data-arg="'+sg.i+'">Continuar</button></div>');break;}
    case 'rcAsk':{
      if(!m)break;d=derive(m,now);var sg2=d.segs[+arg];if(!sg2)break;
      var sel=document.getElementById('rcSel');var raw=sel?sel.value:'';var to=/^\d+$/.test(raw)?+raw:raw;
      if(to===sg2.act){closeSheet();break;}
      openSheet('<h3>Confirmar correção</h3><p>Mover os <b>'+fmtMS(sg2.end-sg2.start)+'</b> deste intervalo de <b>'+esc(actName(m,sg2.act))+'</b> para <b>'+esc(actName(m,to))+'</b>?</p><p class="meta">O registro original continua guardado. Os totais das frações, das partes e da reunião são recalculados sem contar o mesmo tempo duas vezes.</p><div class="two"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn primary" data-act="rcDo" data-arg="'+sg2.i+'|'+esc(String(to))+'">Confirmar</button></div>');break;}
    case 'rcDo':{
      if(!m)break;var pr=String(arg).split('|');var si=+pr[0];var tv=pr.slice(1).join('|');var toV=/^\d+$/.test(tv)?+tv:tv;
      d=derive(m,now);var sg3=d.segs[si];if(!sg3)break;
      m.fixes.push({at:now,seg:si,from:sg3.act,to:toV});save();closeSheet();render();toast('Correção registrada');break;}
    case 'saveSummary':if(m){m.status='saved';save();render();window.scrollTo(0,0);toast('Resumo salvo');}break;
    case 'copy':{
      if(!m)break;var txt=summaryText(m,now);
      try{navigator.clipboard.writeText(txt).then(function(){toast('Resumo copiado');}).catch(function(){summarySheet(txt);});}
      catch(e){summarySheet(txt);}break;}
    case 'csv':{
      if(!m||!dl)break;
      var fn='reuniao-'+dateStr(m.createdAt).split('/').reverse().join('-')+'.csv';
      dl.save({filename:fn,data:csvText(m,now)}).then(function(){toast('Arquivo salvo');}).catch(function(err){if(err&&err.code!=='declined')toast('Não foi possível baixar. Use Copiar resumo.');});break;}
    case 'askDel':
      openSheet('<h3>Apagar esta reunião?</h3><p>Todos os registros desta reunião, inclusive o histórico de correções, serão removidos deste aparelho.</p><div class="two"><button class="btn" data-act="closeSheet">Cancelar</button><button class="btn danger" data-act="del">Apagar</button></div>');break;
    case 'del':{
      if(!m)break;store.meetings=store.meetings.filter(function(x){return x!==m;});save();closeSheet();view={name:'home',id:null};render();toast('Reunião apagada');break;}
  }
}

document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  onAct(el.getAttribute('data-act'),el.getAttribute('data-arg'));
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){tick();var m=cur();if(view.name==='run'&&m&&m.status==='running')wake();}
});

load();
var am=activeMeeting();
if(am){view={name:am.status==='running'?'run':'review',id:am.id};}
render();
if(view.name==='run')wake();
setInterval(tick,250);
try{
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(x){if(x){dl=x;if(view.name==='review')render();}}).catch(function(){});
  }
}catch(e){}
if(window.NativeApp){dl={save:function(r){NativeApp.postMessage(JSON.stringify({action:'csv',filename:r.filename,text:r.data}));return Promise.resolve({status:'shared'});}};}
else if(!window.claude){dl={save:function(r){return new Promise(function(res){var b=new Blob([r.data],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=r.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);res({status:'saved'});});}};}
})();
</script>
